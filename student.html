
<!DOCTYPE html>

<title>مساحة الطالبة | CodeRank</title>
<style>
* { box-sizing: border-box; }
body {

}
header {
  padding: 22px 7%;

}
h1 { color: #63dce8; }
p { color: #b6c5da; line-height: 1.9; }

  width: 100%;
  min-height: 250px;

  padding: 15px;

}
button {
  background: #63dce8;
  color: #081326;

}

<body>
<header>
  <div class="logo">Code<span>Rank</span></div>
  <a href="index.html">الرئيسية ←</a>

<main>

    <h1>مساحة الطالبة</h1>
    <p>أهلًا بك! استعدّي للتحدي البرمجي.</p>

    <p>لغة البرمجة: C++</p>
  </section>

  <section class="card">

    <textarea id="code">#include <iostream>
using namespace std;

int main() {
    int a, b;
    cin >> a >> b;
    cout << a + b;
    return 0;
}</textarea>
    <button onclick="alert('هذا إرسال تجريبي فقط، لم يتم تقييم الكود بعد.')">

    <p class="notice">نسخة أولية: تشغيل C++ والتحقق من الحل سيُضافان لاحقًا.</p>
