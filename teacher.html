
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المعلمة | CodeRank</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #081326;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px 7%;
  border-bottom: 1px solid #263b59;
  display: flex;
  justify-content: space-between;
}
.logo { font-size: 24px; font-weight: bold; }
.logo span { color: #63dce8; }
a { color: #63dce8; text-decoration: none; }
main { max-width: 900px; margin: 45px auto; padding: 20px; }
.card {
  background: #12233d;
  border: 1px solid #29415f;
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 20px;
}
h1 { color: #63dce8; }
p { color: #b6c5da; line-height: 1.9; }
label {
  display: block;
  margin: 18px 0 8px;
}
input, select, textarea {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  border: 1px solid #38506e;
  background: #07101f;
  color: white;
  font-size: 15px;
  margin-top: 8px;
}
textarea { min-height: 120px; }
button {
  background: #63dce8;
  color: #081326;
  border: 0;
  padding: 13px 22px;
  border-radius: 9px;
  font-weight: bold;
  margin-top: 18px;
  cursor: pointer;
}
.notice { color: #f2cf83; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="logo">Code<span>Rank</span></div>
  <a href="index.html">الرئيسية ←</a>
</header>

<main>
  <section class="card">
    <h1>لوحة المعلمة</h1>
    <p>مرحبًا بك في لوحة إدارة تحديات البرمجة.</p>
  </section>

  <section class="card">
    <h2>إنشاء تحدٍّ جديد</h2>

    <form id="challengeForm">
      <label>عنوان التحدي</label>
      <input id="title" required placeholder="مثال: مجموع عددين">

      <label>لغة البرمجة</label>
      <select id="language">
        <option value="C++">C++</option>
        <option value="HTML">HTML</option>
      </select>

      <label>وصف التحدي</label>
      <textarea id="description" required
        placeholder="اكتبي المطلوب من الطالبات..."></textarea>

      <button type="submit">إنشاء التحدي</button>
    </form>

    <p class="notice" id="message">
      هذه نسخة أولية، والحفظ في قاعدة البيانات سيُضاف لاحقًا.
    </p>
  </section>

  <section class="card">
    <h2>المشاركات والترتيب</h2>
    <p>ستظهر هنا حلول الطالبات وترتيبهن بعد ربط قاعدة البيانات.</p>
  </section>
</main>

<script>
document.getElementById("challengeForm").addEventListener("submit", function(e) {
  e.preventDefault();
  document.getElementById("message").textContent =
    "تم تجهيز التحدي في النموذج التجريبي. لم يُحفظ في قاعدة البيانات.";
});
</script>

</body>
</html>
